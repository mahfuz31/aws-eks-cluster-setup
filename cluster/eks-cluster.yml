apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: automated-mumbai-cluster
  region: ap-south-1  # Set to Mumbai for lowest latency from Dhaka
  version: "1.31"

managedNodeGroups:
  - name: general-purpose-nodes
    instanceType: t3.micro
    desiredCapacity: 3
    minSize: 1
    maxSize: 6
    volumeSize: 30
